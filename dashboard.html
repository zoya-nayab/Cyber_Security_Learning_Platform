<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberShield - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .dashboard { max-width: 1000px; margin: 0 auto; padding: 48px 24px; }
    .welcome { margin-bottom: 36px; }
    .welcome p { color: #7a94b0; font-size: 15px; margin-top: 6px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 36px;
    }

    .stat-card {
      background: #0d1428;
      border: 1px solid #1e2d50;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }

    .stat-icon { font-size: 28px; margin-bottom: 10px; }
    .stat-label { font-size: 13px; color: #7a94b0; margin-bottom: 8px; }
    .stat-value { font-size: 32px; font-weight: 700; color: #fff; }

    .section-title {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 18px;
    }

    .progress-item {
      background: #0d1428;
      border: 1px solid #1e2d50;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .progress-icon { font-size: 22px; width: 36px; text-align: center; }

    .progress-info { flex: 1; }

    .progress-name {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      background: #0a0f1e;
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 8px;
      background: linear-gradient(90deg, #1565c0, #4fc3f7);
    }

    .progress-pct {
      font-size: 13px;
      color: #4fc3f7;
      font-weight: 600;
      min-width: 36px;
      text-align: right;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 36px;
    }

    .badge {
      background: #0d1428;
      border: 1px solid #1e2d50;
      border-radius: 10px;
      padding: 14px 18px;
      text-align: center;
    }

    .badge-icon { font-size: 28px; margin-bottom: 6px; }
    .badge-name { font-size: 11px; color: #7a94b0; }
    .badge.locked { opacity: 0.35; filter: grayscale(1); }
  </style>
</head>

<body onload="loadDashboard()">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-logo">🛡️ CyberShield</div>
    <ul class="nav-links">
      <li><a href="lessons.html">Lessons</a></li>
      <li><a href="quiz.html">Quiz</a></li>
      <li><a href="simulation.html">Simulation</a></li>
      <li><a href="password-checker.html">🔒 PW Checker</a></li>
      <li><button class="logout-btn" onclick="logout()">Logout</button></li>
    </ul>
  </nav>

  <!-- DASHBOARD -->
  <div class="dashboard">

    <div class="welcome">
      <h2 id="welcomeText"></h2>
      <p>You're making great progress. Keep it up!</p>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">⭐</div>
        <div class="stat-label">Total Score</div>
        <div class="stat-value" id="score">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">🏅</div>
        <div class="stat-label">Badges Earned</div>
        <div class="stat-value" id="badgeCount">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">📚</div>
        <div class="stat-label">Lessons Done</div>
        <div class="stat-value" id="completed">0</div>
      </div>
    </div>

    <!-- PROGRESS -->
    <div class="section-title">Module Progress</div>
    <div id="progressList"></div>

    <!-- ACTIONS -->
    <div class="actions-grid">
      <a href="lessons.html" class="btn-primary" style="text-align:center;">📖 Start Lessons</a>
      <a href="quiz.html" class="btn-secondary" style="text-align:center;">📝 Take Quiz</a>
      <a href="simulation.html" class="btn-primary" style="text-align:center;">🎯 Try Simulation</a>
    </div>

    <!-- BADGES -->
    <div class="section-title">Your Badges</div>
    <div class="badges-grid" id="badgesGrid"></div>

  </div>

  <!-- SCRIPTS -->
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>

</body>
</html>
